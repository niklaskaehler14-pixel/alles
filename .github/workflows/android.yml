name: Android-App bauen

on:
  push:
    paths: ["voice-todo-android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-todo-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Signaturschlüssel bereitstellen
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret SIGNING_KEYSTORE_B64 fehlt – es wird kein Download veröffentlicht, weil sich die App sonst nicht aktualisieren ließe."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: APK bauen
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Sprachliste.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sprachliste-APK
          path: voice-todo-android/Sprachliste.apk
      # Fester Direkt-Link: .../releases/latest/download/Sprachliste.apk
      - name: Als Download veröffentlichen
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest Sprachliste.apk \
            --target "${{ github.sha }}" \
            --title "Sprachliste $VERSION" \
            --notes "Auf dem Handy öffnen, Sprachliste.apk antippen und installieren." \
            --latest
