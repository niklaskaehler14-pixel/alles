name: Android-App bauen

on:
  push:
    paths: ["voice-todo-android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-todo-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: APK bauen
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Sprachliste-APK
          path: voice-todo-android/app/build/outputs/apk/release/*.apk
