<!doctype html>
<html><head><meta charset="utf-8"><title>debug map</title>
<style>body{margin:0;background:#222}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { buildCity, DIRS } from '../src/citymap.js';
import { buildLayout } from '../src/layout.js';
const params = new URLSearchParams(location.search);
const city = buildCity();
const cx = +(params.get('x') ?? -60), cz = +(params.get('z') ?? -40), scale = +(params.get('s') ?? 1.2);
const W = +(params.get('w') ?? 1600), Hh = +(params.get('h') ?? 1100);
const c = document.getElementById('c'); c.width = W; c.height = Hh;
const g = c.getContext('2d');
const X = (x) => (x - cx) * scale + W / 2, Z = (z) => (z - cz) * scale + Hh / 2;
g.fillStyle = '#3a3d42'; g.fillRect(0, 0, W, Hh);
const poly = (pts, fill, stroke, lw = 1) => { g.beginPath(); for (let i = 0; i < pts.length; i += 2) (i ? g.lineTo : g.moveTo).call(g, X(pts[i]), Z(pts[i + 1])); g.closePath(); if (fill) { g.fillStyle = fill; g.fill('evenodd'); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); } };
const useCol = { park: '#4d7a3a', market: '#9a8f78', outer: '#56704a' };
for (const r of city.regions) {
  if (r.outer) { g.beginPath(); g.rect(0,0,W,Hh); for (let i = 0; i < r.curb.length; i += 2) (i ? g.lineTo : g.moveTo).call(g, X(r.curb[i]), Z(r.curb[i + 1])); g.closePath(); g.fillStyle = '#8a8a86'; g.fill('evenodd'); continue; }
  poly(r.curb, '#8a8a86', '#ddd', 1);
  poly(r.front, useCol[r.use] || '#6b5f55', null);
  poly(r.walk, null, 'rgba(255,255,255,0.25)', 1);
}
const outer = city.regions.find(r=>r.outer); poly(outer.walk, null, 'rgba(255,255,255,0.25)', 1); poly(outer.front, null, 'rgba(120,200,120,0.6)', 1);
g.lineWidth = 1;
for (const l of city.lanes) { const p = l.path.pts; g.strokeStyle = l.speed === 30 ? '#6cf' : '#fff'; g.beginPath(); g.moveTo(X(p[0]), Z(p[1])); g.lineTo(X(p[2]), Z(p[3])); g.stroke();
  const e = l.path.at(l.path.length); g.fillStyle = l.endControl === 'signal' ? '#f33' : l.endControl === 'stop' ? '#f0f' : l.endControl === 'yield' ? '#fa0' : l.endControl === 'rbl' ? '#0ff' : '#0f0'; g.fillRect(X(e.x) - 2, Z(e.z) - 2, 4, 4); }
for (const m of city.movements) { const p = m.path.pts; g.strokeStyle = m.turn === 'right' ? 'rgba(255,120,120,0.7)' : m.turn === 'left' ? 'rgba(120,160,255,0.7)' : 'rgba(255,255,255,0.35)'; g.beginPath(); for (let i = 0; i < p.length; i += 2) (i ? g.lineTo : g.moveTo).call(g, X(p[i]), Z(p[i + 1])); g.stroke(); }
for (const cr of city.crossings) { g.strokeStyle = cr.kind === 'zebra' ? '#fff' : '#ff0'; g.lineWidth = Math.max(1, cr.width * scale); g.beginPath(); g.moveTo(X(cr.x - cr.ux * cr.extNeg), Z(cr.z - cr.uz * cr.extNeg)); g.lineTo(X(cr.x + cr.ux * cr.extPos), Z(cr.z + cr.uz * cr.extPos)); g.globalAlpha = 0.5; g.stroke(); g.globalAlpha = 1; }
g.lineWidth = 1;
for (const s of city.stops) { const l = city.lanes[s.lane]; const p = l.path.at(s.sFront); const q = l.path.at(s.sFront - s.zone);
  g.strokeStyle = '#ffd400'; g.lineWidth = 3; g.beginPath(); g.moveTo(X(p.x + s.rx * s.curbOffset * 0.8), Z(p.z + s.rz * s.curbOffset * 0.8)); g.lineTo(X(q.x + s.rx * s.curbOffset * 0.8), Z(q.z + s.rz * s.curbOffset * 0.8)); g.stroke();
  g.fillStyle = '#0a0'; g.beginPath(); g.arc(X(s.x + s.rx*0.6), Z(s.z + s.rz*0.6), 3, 0, 7); g.fill();
  if (scale < 3) { g.fillStyle = '#fff'; g.font = '11px sans-serif'; g.fillText(s.id, X(s.x) + 4, Z(s.z) - 4); } }
g.lineWidth = 1;
const signCol = { yield: '#fa0', stop: '#f0f', priorityRoad: '#ff0', priorityNext: '#fc6', zone30: '#6cf', zone30end: '#369' };
for (const s of city.signs) { g.fillStyle = signCol[s.type] || '#fff'; g.fillRect(X(s.x) - 2, Z(s.z) - 2, 5, 5); }
if (scale < 2) for (const n of city.nodes) { if (n.kind === 'none') continue; g.fillStyle = '#fff'; g.font = '10px sans-serif'; g.fillText(n.key + (n.control !== 'none' ? ' ' + n.control : ''), X(n.x) + 3, Z(n.z) + 12); }
const L = buildLayout(city);
const box = (b, fill, stroke) => { const s = Math.sin(b.yaw), c = Math.cos(b.yaw); const pts = []; for (const [f, l] of [[1,1],[1,-1],[-1,-1],[-1,1]]) { pts.push(b.x + s*f*b.hl + c*l*b.hw, b.z + c*f*b.hl - s*l*b.hw); } poly(pts, fill, stroke); };
const areaCol = { grass: '#4f7d3b', plaza: '#a79f8e', parking: '#55585c', pitch: '#3f8a3a', schoolyard: '#8c7f70', path: '#b5a68a' };
for (const a of L.areas) poly(a.pts, areaCol[a.type] || '#f0f', null);
const styleCol = { plaster: '#d9c7a3', modern: '#c9ced3', office: '#7fa7c9', civic: '#c2a878', brick: '#a45a45', oldtown: '#e0b98a' };
for (const b of L.buildings) box({ x: b.x, z: b.z, yaw: b.yaw, hl: b.d/2, hw: b.w/2 }, styleCol[b.style], '#222');
for (const b of L.boxes) if (b.kind !== 'building') box(b, null, '#f44');
for (const t of L.trees) { g.fillStyle = t.kind === 'lime' ? '#9c3' : '#2a5'; g.beginPath(); g.arc(X(t.x), Z(t.z), Math.max(1.5, 2.2 * scale * t.scale), 0, 7); g.fill(); }
for (const l of L.lamps) { g.fillStyle = '#ff8'; g.fillRect(X(l.x) - 1, Z(l.z) - 1, 3, 3); }
for (const m of L.landmarks) { g.fillStyle = '#fff'; g.font = 'bold 12px sans-serif'; g.fillText(m.type, X(m.x) - 20, Z(m.z)); }
for (const sf of L.stopFurniture) { g.fillStyle = '#0f0'; g.fillRect(X(sf.pole[0]) - 2, Z(sf.pole[1]) - 2, 4, 4); g.fillStyle = '#08f'; g.fillRect(X(sf.shelter[0]) - 3, Z(sf.shelter[1]) - 3, 6, 6); }
window.__done = true;
</script></body></html>
