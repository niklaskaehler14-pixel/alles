<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Mail-Signatur</title>
<style>
  body{margin:0;padding:40px 16px;background:#f4f5f8;font-family:Arial,Helvetica,sans-serif;color:#1d2230}
  .hint{max-width:560px;margin:0 auto 24px;font-size:14px;line-height:1.5;color:#555}
  .box{max-width:560px;margin:0 auto;background:#fff;border-radius:12px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
  /* Animationen: funktionieren in Apple Mail, iOS Mail, Thunderbird.
     Gmail/Outlook ignorieren sie – die Signatur sieht dort trotzdem sauber aus. */
  @keyframes sigFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes sigGlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  @keyframes sigPulse{0%,100%{box-shadow:0 0 0 0 rgba(108,92,231,.45)}50%{box-shadow:0 0 0 8px rgba(108,92,231,0)}}
  .sig-anim{animation:sigFade .8s ease-out both}
  .sig-anim2{animation:sigFade .8s .2s ease-out both}
  .sig-anim3{animation:sigFade .8s .4s ease-out both}
  .sig-bar{background:linear-gradient(90deg,#6c5ce7,#00b4d8,#6c5ce7);background-size:200% 100%;animation:sigGlow 4s ease-in-out infinite}
  .sig-logo{animation:sigPulse 2.5s ease-in-out infinite}
  .sig-link:hover{color:#6c5ce7 !important}
  button{margin-top:20px;padding:10px 18px;border:0;border-radius:8px;background:#6c5ce7;color:#fff;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<p class="hint"><b>So nutzt du sie:</b> Auf „Signatur kopieren“ klicken → in Gmail unter <i>Einstellungen → Alle Einstellungen → Signatur</i> einfügen. Name/Titel unten in der Datei einfach anpassen.</p>

<div class="box">
<!-- ===== SIGNATUR START ===== -->
<div id="signatur">
<table cellpadding="0" cellspacing="0" border="0" style="font-family:Arial,Helvetica,sans-serif;color:#1d2230;border-collapse:collapse">
  <tr>
    <td style="vertical-align:middle;padding-right:16px">
      <div class="sig-logo" style="width:64px;height:64px;border-radius:50%;background:#6c5ce7;background-image:linear-gradient(135deg,#6c5ce7,#00b4d8);color:#fff;font-size:24px;font-weight:bold;line-height:64px;text-align:center;letter-spacing:1px">NK</div>
    </td>
    <td class="sig-bar" style="width:3px;background:#6c5ce7;border-radius:3px">&nbsp;</td>
    <td style="vertical-align:middle;padding-left:16px">
      <div class="sig-anim" style="font-size:18px;font-weight:bold;color:#1d2230">Niklas Kähler</div>
      <div class="sig-anim2" style="font-size:13px;color:#6c5ce7;margin-top:2px">Developer · Creator</div>
      <div class="sig-anim3" style="font-size:13px;margin-top:8px;line-height:1.6">
        ✉️ <a class="sig-link" href="mailto:tik072343@gmail.com" style="color:#1d2230;text-decoration:none">tik072343@gmail.com</a><br>
        💻 <a class="sig-link" href="https://github.com/niklaskaehler14-pixel" style="color:#1d2230;text-decoration:none">github.com/niklaskaehler14-pixel</a>
      </div>
    </td>
  </tr>
</table>
</div>
<!-- ===== SIGNATUR ENDE ===== -->
</div>

<div style="text-align:center"><button onclick="copySig()">Signatur kopieren</button></div>

<script>
function copySig(){
  const r=document.createRange();r.selectNode(document.getElementById('signatur'));
  const s=getSelection();s.removeAllRanges();s.addRange(r);
  document.execCommand('copy');s.removeAllRanges();
  event.target.textContent='✓ Kopiert!';
}
</script>
</body>
</html>
